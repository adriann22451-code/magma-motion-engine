<!DOCTYPE html>

<style>

.blue{

}

}

}

input[type=file]{

.status{

.row{

.row span{

.row input{

}

.row b{

.info{

}

.preview{

}

.reviewBox{

  background:
    linear-gradient(45deg,#171e29 25%,transparent 25%),
    linear-gradient(-45deg,#171e29 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#171e29 75%),
    linear-gradient(-45deg,transparent 75%,#171e29 75%);

  background-size:16px 16px;

  background-position:
    0 0,

    8px -8px,
    -8px 0;
}

#reviewCanvas{
  width:100%;

}

.previewBox{

  background:
    linear-gradient(45deg,#171e29 25%,transparent 25%),
    linear-gradient(-45deg,#171e29 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#171e29 75%),
    linear-gradient(-45deg,transparent 75%,#171e29 75%);

  background-size:12px 12px;

  background-position:
    0 0,
    0 6px,
    6px -6px,
    -6px 0;
}
</style>
</head>

<body>

<div class="app">

<h1>AI Motion Engine V15</h1>

2D Walk Cycle — Joint Based Animation
</div>


<!-- =====================================================
UPLOAD

id="canvas"
width="700"

</canvas>

<!-- =====================================================
RIG PLACEMENT
===================================================== -->

<div class="panel" id="rigPlacePanel" style="display:none;">

<div class="info">
Geser titik merah ke posisi sendi yang benar
(kepala, dada, bahu, pinggul) — abaikan yang

<!-- =====================================================
CONTROLS
===================================================== -->

<div class="panel">

<button
id="rig"

🦴 SHOW RIG
</button>

id="walk"

0.8

0.65
</b>

id="arm"

0.55
</b>

id="rigStatus"

SPRITE

id="preview"

id="reviewToggle"

style="display:block;margin:8px auto 0;">

▶ REVIEW GERAKAN

id="spriteStatus"
class="status">

Belum ada sprite.

</div>

id="download"
class="green">

⬇ DOWNLOAD SPRITE

</button>

<script>

/* =====================================================
ELEMENTS
===================================================== */

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const fileInput =
document.getElementById("file");

const statusBox =
document.getElementById("status");

const rigStatus =
document.getElementById("rigStatus");

const spriteStatus =
document.getElementById("spriteStatus");

const preview =
document.getElementById("preview");

const speedInput =
document.getElementById("speed");

const stepInput =
document.getElementById("step");

const armInput =
document.getElementById("arm");

const speedText =
document.getElementById("speedText");

const stepText =
document.getElementById("stepText");

const armText =
document.getElementById("armText");

const rigPlacePanel=
document.getElementById("rigPlacePanel");

const lockRigBtn=
document.getElementById("lockRig");

const resetRigPosBtn=
document.getElementById("resetRigPos");

const reviewCanvas=
document.getElementById("reviewCanvas");

const reviewCtx=
reviewCanvas.getContext("2d");

const reviewToggleBtn=
document.getElementById("reviewToggle");


/* =====================================================
STATE
===================================================== */

let source=null;

let bounds=null;

let mesh=[];

let triangles=[];

let bones=[];

let playing=false;

let showRig=false;

let phase=0;

let lastTime=
performance.now();

let spriteSheet=null;

/*
  Manual rig placement state.
*/

let rigPlacing=false;

let draftBones=[];

let dragIndex=null;

/*
  Sprite review playback state.
*/

let generatedFrames=[];

let reviewPlaying=false;

let reviewIndex=0;

let reviewTimer=0;


/*
  Mesh resolution.
  Higher = smoother.
*/

const COLS=18;

const ROWS=28;


/* =====================================================
UPLOAD
===================================================== */

fileInput.addEventListener(
"change",
function(e){

  const file=
  e.target.files[0];

  if(!file)return;


  const reader=
  new FileReader();


  reader.onload=
  function(ev){

    const img=
    new Image();


    img.onload=
    function(){

      createSource(img);

      startRigPlacement();

      phase=0;

      playing=false;


      statusBox.className=
      "status ok";

      statusBox.innerHTML=
      "✓ Karakter berhasil dimuat.<br>"+
      "Atur posisi sendi di bawah, lalu kunci rig.";

    };


    img.src=
    ev.target.result;

  };


  reader.readAsDataURL(file);

});


/* =====================================================
CREATE SOURCE
===================================================== */

function createSource(img){

  let w=
  img.naturalWidth;

  let h=
  img.naturalHeight;


  const max=500;

  const scale=
  Math.min(
    1,
    max/Math.max(w,h)
  );


  w=
  Math.round(w*scale);

  h=
  Math.round(h*scale);


  source=
  document.createElement(
    "canvas"
  );


  source.width=w;

  source.height=h;


  const sctx=
  source.getContext("2d");


  sctx.clearRect(
    0,
    0,
    w,
    h
  );


  sctx.drawImage(
    img,
    0,
    0,
    w,
    h
  );


  bounds=
  getBounds();

}


/* =====================================================
ALPHA BOUNDS
===================================================== */

function getBounds(){

  const sctx=
  source.getContext("2d");


  const data=
  sctx.getImageData(
    0,
    0,
    source.width,
    source.height
  ).data;


  let minX=
  source.width;

  let minY=
  source.height;

  let maxX=-1;

  let maxY=-1;


  for(
    let y=0;
    y<source.height;
    y++
  ){

    for(
      let x=0;
      x<source.width;
      x++
    ){

      const i=
      (y*source.width+x)*4;


      if(data[i+3]>10){

        minX=
        Math.min(
          minX,
          x
        );

        minY=
        Math.min(
          minY,
          y
        );

        maxX=
        Math.max(
          maxX,
          x
        );

        maxY=
        Math.max(
          maxY,
          y
        );

      }

    }

  }


  if(maxX<0){

    return{
      x:0,
      y:0,
      w:source.width,
      h:source.height
    };

  }


  return{

    x:minX,

    y:minY,

    w:maxX-minX+1,

    h:maxY-minY+1

  };

}


/* =====================================================
VIEW TRANSFORM
(shared by placement + ORIGINAL view)
===================================================== */

function getViewTransform(){

  const scale=
  Math.min(
    620/source.width,
    620/source.height
  );

  const ox=
  (700-source.width*scale)/2;

  const oy=
  (700-source.height*scale)/2;

  return{scale,ox,oy};

}


function sourceToCanvas(pt){

  const t=
  getViewTransform();

  return{

    x:t.ox+pt.x*t.scale,

    y:t.oy+pt.y*t.scale

  };

}


function canvasToSource(pt){

  const t=
  getViewTransform();

  return{

    x:(pt.x-t.ox)/t.scale,

    y:(pt.y-t.oy)/t.scale

  };

}


function getCanvasPos(e){

  const rect=
  canvas.getBoundingClientRect();

  const x=
  (e.clientX-rect.left)*
  (canvas.width/rect.width);

  const y=
  (e.clientY-rect.top)*
  (canvas.height/rect.height);

  return{x,y};

}


/* =====================================================
DRAW RIG PLACEMENT
===================================================== */

function drawRigPlacement(){

  ctx.setTransform(1,0,0,1,0,0);

  ctx.clearRect(0,0,700,700);

  if(!source)return;


  const t=
  getViewTransform();


  ctx.drawImage(
    source,
    t.ox,
    t.oy,
    source.width*t.scale,
    source.height*t.scale
  );


  for(
    const d of draftBones
  ){

    const p=
    sourceToCanvas(
      {x:d.baseX,y:d.baseY}
    );


    ctx.beginPath();

    ctx.arc(
      p.x,p.y,16,0,Math.PI*2
    );

    ctx.fillStyle=
    "rgba(255,77,109,.35)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      p.x,p.y,7,0,Math.PI*2
    );

    ctx.fillStyle=
    "#ff4d6d";

    ctx.fill();

    ctx.strokeStyle=
    "#fff";

    ctx.lineWidth=2;

    ctx.stroke();


    ctx.fillStyle=
    "#fff";

    ctx.font=
    "bold 12px Arial";

    ctx.textAlign=
    "center";

    ctx.fillText(
      d.label,
      p.x,
      p.y-22
    );

  }

}


/* =====================================================
RIG PLACEMENT DRAG EVENTS
===================================================== */

canvas.addEventListener(
"pointerdown",
function(e){

  if(!rigPlacing)return;


  const pos=
  getCanvasPos(e);


  let best=null;

  let bestDist=
  Infinity;


  draftBones.forEach(
  function(d,i){

    const p=
    sourceToCanvas(
      {x:d.baseX,y:d.baseY}
    );

    const dist=
    Math.hypot(
      p.x-pos.x,
      p.y-pos.y
    );

    if(
      dist<34&&
      dist<bestDist
    ){

      bestDist=dist;

      best=i;

    }

  });


  if(best!==null){

    dragIndex=best;

    canvas.setPointerCapture(
      e.pointerId
    );

  }

});


canvas.addEventListener(
"pointermove",
function(e){

  if(!rigPlacing)return;

  if(dragIndex===null)return;


  const pos=
  getCanvasPos(e);

  const src=
  canvasToSource(pos);


  draftBones[dragIndex].baseX=
  src.x;

  draftBones[dragIndex].baseY=
  src.y;


  drawRigPlacement();

});


function endDrag(){

  dragIndex=null;

}


canvas.addEventListener(
"pointerup",endDrag
);

canvas.addEventListener(
"pointercancel",endDrag
);


lockRigBtn.addEventListener(
"click",
function(){

  if(!source)return;

  confirmRig();

});


resetRigPosBtn.addEventListener(
"click",
function(){

  if(!source)return;

  draftBones=
  defaultBoneDefs(bounds);

  drawRigPlacement();

});


/* =====================================================
CREATE RIG
===================================================== */

function defaultBoneDefs(b){

  const cx=
  b.x+b.w*.5;


  /*
    Starting guess positions.
    User drags these onto the
    real joints of THIS character.
  */

  return[

    {
      name:"root",
      label:"Pinggang",
      baseX:cx,
      baseY:b.y+b.h*.58,
      radius:b.h*.14
    },

    {
      name:"chest",
      label:"Dada",
      baseX:cx,
      baseY:b.y+b.h*.35,
      radius:b.h*.13
    },

    {
      name:"head",
      label:"Kepala",
      baseX:cx,
      baseY:b.y+b.h*.13,
      radius:b.h*.11
    },

    {
      name:"leftShoulder",
      label:"Bahu Kiri",
      baseX:b.x+b.w*.28,
      baseY:b.y+b.h*.34,
      radius:b.h*.11
    },

    {
      name:"rightShoulder",
      label:"Bahu Kanan",
      baseX:b.x+b.w*.72,
      baseY:b.y+b.h*.34,
      radius:b.h*.11
    },

    {
      name:"leftHip",
      label:"Pinggul Kiri",
      baseX:b.x+b.w*.43,
      baseY:b.y+b.h*.56,
      radius:b.h*.13
    },

    {
      name:"rightHip",
      label:"Pinggul Kanan",
      baseX:b.x+b.w*.57,
      baseY:b.y+b.h*.56,
      radius:b.h*.13
    }

  ];

}


/* =====================================================
START RIG PLACEMENT
===================================================== */

function startRigPlacement(){

  draftBones=
  defaultBoneDefs(bounds);

  rigPlacing=true;

  dragIndex=null;


  rigPlacePanel.style.display=
  "block";


  rigStatus.className=
  "status warn";

  rigStatus.innerHTML=
  "⚠ Rig belum dikunci.<br>"+
  "Geser titik ke sendi yang benar dulu.";


  draw();

}


/* =====================================================
CONFIRM RIG
===================================================== */

function confirmRig(){

  bones=
  draftBones.map(
  function(d){

    return{

      name:d.name,

      baseX:d.baseX,
      baseY:d.baseY,

      x:d.baseX,
      y:d.baseY,

      dx:0,
      dy:0,
      angle:0,

      radius:d.radius

    };

  });


  rigPlacing=false;

  dragIndex=null;

  rigPlacePanel.style.display=
  "none";


  createMesh();


  rigStatus.className=
  "status ok";

  rigStatus.innerHTML=
  "✓ Rig dikunci.<br>"+
  "Torso tetap stabil, kaki dan tangan bergerak bergantian.";


  draw();

}


/* =====================================================
WEIGHTS
===================================================== */

function weightsFor(x,y){

  const values=[];


  for(
    const bone of bones
  ){

    /*
      Horizontal/vertical distance.
    */

    const dx=
    x-bone.baseX;

    const dy=
    y-bone.baseY;


    const d=
    Math.sqrt(
      dx*dx+
      dy*dy
    );


    let w=
    1-
    d/bone.radius;


    if(w<0)
      w=0;


    /*
      Sharper weighting.
      This prevents entire body
      moving together.
    */

    w=
    Math.pow(
      w,
      3
    );


    values.push({
      bone,
      weight:w
    });

  }


  values.sort(
    (a,b)=>
    b.weight-a.weight
  );


  const selected=
  values.slice(0,3);


  let total=0;


  for(
    const item of selected
  ){

    total+=item.weight;

  }


  if(total<=0){

    return[

      {
        bone:bones[1],
        weight:1
      }

    ];

  }


  for(
    const item of selected
  ){

    item.weight/=total;

  }


  return selected;

}


/* =====================================================
CREATE MESH
===================================================== */

function createMesh(){

  mesh=[];

  triangles=[];


  for(
    let y=0;
    y<=ROWS;
    y++
  ){

    for(
      let x=0;
      x<=COLS;
      x++
    ){

      const px=
      bounds.x+
      bounds.w*x/COLS;


      const py=
      bounds.y+
      bounds.h*y/ROWS;


      mesh.push({

        ox:px,

        oy:py,

        weights:
        weightsFor(
          px,
          py
        )

      });

    }

  }


  for(
    let y=0;
    y<ROWS;
    y++
  ){

    for(
      let x=0;
      x<COLS;
      x++
    ){

      const i=
      y*(COLS+1)+x;


      const a=i;

      const b=i+1;

      const c=
      i+COLS+1;

      const d=c+1;


      triangles.push([
        a,b,d
      ]);

      triangles.push([
        a,d,c
      ]);

    }

  }

}


/* =====================================================
RESET BONES
===================================================== */

function resetBones(){

  for(
    const bone of bones
  ){

    bone.x=
    bone.baseX;

    bone.y=
    bone.baseY;

    bone.dx=0;

    bone.dy=0;

    bone.angle=0;

  }

}


/* =====================================================
WALK POSE
===================================================== */

function applyWalkPose(){

  resetBones();


  const amount=
  Number(
    stepInput.value
  );


  const armAmount=
  Number(
    armInput.value
  );


  /*
    Sine wave.
  */

  const s=
  Math.sin(
    phase*Math.PI*2
  );


  const c=
  Math.cos(
    phase*Math.PI*2
  );


  /*
    Per-leg lift.
    Only ONE leg lifts at a time
    (fixes the "zoom in/out" bug
    caused by both legs rising
    together every half-cycle).
  */

  const liftL=
  Math.max(0,s);

  const liftR=
  Math.max(0,-s);


  /*
    Find bones.
  */

  const root=
  bones.find(
    b=>b.name==="root"
  );

  const chest=
  bones.find(
    b=>b.name==="chest"
  );

  const head=
  bones.find(
    b=>b.name==="head"
  );

  const ls=
  bones.find(
    b=>b.name==="leftShoulder"
  );

  const rs=
  bones.find(
    b=>b.name==="rightShoulder"
  );

  const lh=
  bones.find(
    b=>b.name==="leftHip"
  );

  const rh=
  bones.find(
    b=>b.name==="rightHip"
  );


  /*
    IMPORTANT:
    No global scale.
  */


  /*
    BODY
    only tiny vertical movement.
  */

  root.dy=
  -Math.abs(s)*
  2*
  amount;


  chest.dy=
  -Math.abs(s)*
  1.5*
  amount;


  /*
    HEAD
    very small counter movement.
  */

  head.dy=
  Math.abs(s)*
  .8*
  amount;


  /*
    LEFT LEG
    forward/backward.
  */

  lh.dx=
  s*
  bounds.w*
  .10*
  amount;


  lh.dy=
  -liftL*
  bounds.h*
  .07*
  amount;


  /*
    No rotation on hips —
    pure sliding avoids the
    multi-pivot blend collapse
    ("candy wrapper" zoom bug).
  */


  /*
    RIGHT LEG
    opposite.
  */

  rh.dx=
  -s*
  bounds.w*
  .10*
  amount;


  rh.dy=
  -liftR*
  bounds.h*
  .07*
  amount;


  /*
    ARMS opposite legs.
    Also split so only one arm
    lifts at a time (matches legs).
  */

  ls.dx=
  -s*
  bounds.w*
  .045*
  armAmount;


  ls.dy=
  -liftR*
  1.5*
  armAmount;


  rs.dx=
  s*
  bounds.w*
  .045*
  armAmount;


  rs.dy=
  -liftL*
  1.5*
  armAmount;

}


/* =====================================================
TRANSFORM MESH POINT
===================================================== */

function transformPoint(v){

  let x=0;

  let y=0;


  for(
    const influence of v.weights
  ){

    const bone=
    influence.bone;


    /*
      Local position around bone.
    */

    const dx=
    v.ox-
    bone.baseX;


    const dy=
    v.oy-
    bone.baseY;


    const co=
    Math.cos(
      bone.angle
    );


    const si=
    Math.sin(
      bone.angle
    );


    const rx=
    bone.baseX+
    dx*co-
    dy*si;


    const ry=
    bone.baseY+
    dx*si+
    dy*co;


    /*
      Add joint translation.
    */

    const tx=
    rx+
    bone.dx;


    const ty=
    ry+
    bone.dy;


    x+=
    tx*
    influence.weight;


    y+=
    ty*
    influence.weight;

  }


  return{x,y};

}


/* =====================================================
AFFINE
===================================================== */

function affine(
  s0,s1,s2,
  d0,d1,d2
){

  const den=
  s0.x*(s1.y-s2.y)+
  s1.x*(s2.y-s0.y)+
  s2.x*(s0.y-s1.y);


  if(
    Math.abs(den)<.00001
  ){

    return null;

  }


  const a=
  (
    d0.x*(s1.y-s2.y)+
    d1.x*(s2.y-s0.y)+
    d2.x*(s0.y-s1.y)
  )/den;


  const c=
  (
    d0.x*(s2.x-s1.x)+
    d1.x*(s0.x-s2.x)+
    d2.x*(s1.x-s0.x)
  )/den;


  const e=
  (
    d0.x*
    (s1.x*s2.y-s2.x*s1.y)+

    d1.x*
    (s2.x*s0.y-s0.x*s2.y)+

    d2.x*
    (s0.x*s1.y-s1.x*s0.y)
  )/den;


  const b=
  (
    d0.y*(s1.y-s2.y)+
    d1.y*(s2.y-s0.y)+
    d2.y*(s0.y-s1.y)
  )/den;


  const d=
  (
    d0.y*(s2.x-s1.x)+
    d1.y*(s0.x-s2.x)+
    d2.y*(s1.x-s0.x)
  )/den;


  const f=
  (
    d0.y*
    (s1.x*s2.y-s2.x*s1.y)+

    d1.y*
    (s2.x*s0.y-s0.x*s2.y)+

    d2.y*
    (s0.x*s1.y-s1.x*s0.y)
  )/den;


  return{
    a,b,c,d,e,f
  };

}


/* =====================================================
DRAW TRIANGLE
===================================================== */

function drawTriangle(
  target,
  s0,s1,s2,
  d0,d1,d2
){

  const m=
  affine(
    s0,s1,s2,
    d0,d1,d2
  );


  if(!m)return;


  target.save();


  target.beginPath();

  target.moveTo(
    d0.x,
    d0.y
  );

  target.lineTo(
    d1.x,
    d1.y
  );

  target.lineTo(
    d2.x,
    d2.y
  );

  target.closePath();

  target.clip();


  target.setTransform(
    m.a,
    m.b,
    m.c,
    m.d,
    m.e,
    m.f
  );


  target.drawImage(
    source,
    0,
    0
  );


  target.restore();

}


/* =====================================================
RENDER
===================================================== */

function render(
  target,
  size
){

  if(!source)return;


  const scale=
  Math.min(
    (size-80)/source.width,
    (size-80)/source.height
  );


  const ox=
  (size-
   source.width*scale)/2;


  const oy=
  (size-
   source.height*scale)/2;


  const transformed=
  mesh.map(
    transformPoint
  );


  for(
    const tri of triangles
  ){

    const a=
    mesh[tri[0]];

    const b=
    mesh[tri[1]];

    const c=
    mesh[tri[2]];


    const ta=
    transformed[tri[0]];

    const tb=
    transformed[tri[1]];

    const tc=
    transformed[tri[2]];


    const s0={
      x:a.ox,
      y:a.oy
    };


    const s1={
      x:b.ox,
      y:b.oy
    };


    const s2={
      x:c.ox,
      y:c.oy
    };


    const d0={
      x:ox+ta.x*scale,
      y:oy+ta.y*scale
    };


    const d1={
      x:ox+tb.x*scale,
      y:oy+tb.y*scale
    };


    const d2={
      x:ox+tc.x*scale,
      y:oy+tc.y*scale
    };


    drawTriangle(
      target,
      s0,s1,s2,
      d0,d1,d2
    );

  }

}


/* =====================================================
DRAW RIG
===================================================== */

function drawRig(){

  if(!showRig)return;

  if(!source)return;


  const size=700;


  const scale=
  Math.min(
    (size-80)/source.width,
    (size-80)/source.height
  );


  const ox=
  (size-
   source.width*scale)/2;


  const oy=
  (size-
   source.height*scale)/2;


  ctx.save();


  /*
    Bone positions.
  */

  for(
    const bone of bones
  ){

    const x=
    ox+
    (bone.baseX+
     bone.dx)*
    scale;


    const y=
    oy+
    (bone.baseY+
     bone.dy)*
    scale;


    /*
      Influence circle.
    */

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      7,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
    "#ff4d6d";

    ctx.fill();


    /*
      Direction.
    */

    ctx.beginPath();

    ctx.moveTo(
      x,
      y
    );


    ctx.lineTo(
      x+
      Math.cos(
        bone.angle
      )*
      30,

      y+
      Math.sin(
        bone.angle
      )*
      30
    );


    ctx.strokeStyle=
    "#4da6ff";

    ctx.lineWidth=3;

    ctx.stroke();

  }


  /*
    Ground line.
  */

  const ground=
  oy+
  (
    bounds.y+
    bounds.h*.92
  )*
  scale;


  ctx.beginPath();

  ctx.moveTo(
    70,
    ground
  );

  ctx.lineTo(
    630,
    ground
  );

  ctx.strokeStyle=
  "rgba(255,255,255,.18)";

  ctx.lineWidth=2;

  ctx.stroke();


  ctx.restore();

}


/* =====================================================
MAIN DRAW
===================================================== */

function draw(){

  if(rigPlacing){

    drawRigPlacement();

    return;

  }


  ctx.setTransform(
    1,0,0,1,0,0
  );


  ctx.clearRect(
    0,
    0,
    700,
    700
  );


  if(!source){

    ctx.fillStyle=
    "#8792a5";

    ctx.textAlign=
    "center";

    ctx.font=
    "18px Arial";

    ctx.fillText(
      "Pilih PNG karakter",
      350,
      350
    );

    return;

  }


  /*
    Draw complete character.
  */

  render(
    ctx,
    700
  );


  drawRig();

}

/* =====================================================
ANIMATION LOOP
===================================================== */

function loop(now){

  const dt=
  (now-lastTime)/1000;


  lastTime=now;


  if(playing){

    phase+=
    dt*
    Number(
      speedInput.value
    )*
    .65;


    if(phase>=1){

      phase-=1;

    }


    applyWalkPose();

    draw();

  }


  if(
    reviewPlaying&&
    generatedFrames.length>0
  ){

    const frameInterval=
    .15/
    Number(
      speedInput.value
    );


    reviewTimer+=dt;


    while(
      reviewTimer>=
      frameInterval
    ){

      reviewTimer-=
      frameInterval;

      reviewIndex=
      (reviewIndex+1)%
      generatedFrames.length;

    }


    drawReviewFrame();

  }


  requestAnimationFrame(
    loop
  );

}


/* =====================================================
DRAW REVIEW FRAME
===================================================== */

function drawReviewFrame(){

  reviewCtx.clearRect(
    0,
    0,
    reviewCanvas.width,
    reviewCanvas.height
  );


  if(generatedFrames.length===0)
    return;


  reviewCtx.drawImage(
    generatedFrames[reviewIndex],
    0,
    0
  );

}

function(){

    return;

  }


  reviewPlaying=
  !reviewPlaying;


  reviewToggleBtn.textContent=
  reviewPlaying
  ? "■ STOP REVIEW"
  : "▶ REVIEW GERAKAN";


  reviewTimer=0;

});


requestAnimationFrame(
loop
);


/* =====================================================
MAKE FRAME
===================================================== */

function makeFrame(
framePhase,
size
){

  const frame=
  document.createElement(
    "canvas"
  );


  frame.width=size;

  frame.height=size;


  const fctx=
  frame.getContext(
    "2d"
  );


  const oldPhase=
  phase;


  phase=
  framePhase;


  applyWalkPose();


  render(
    fctx,
    size
  );


  phase=
  oldPhase;


  return frame;

}


/* =====================================================
GENERATE SPRITE
===================================================== */

document
.getElementById("generate")
.addEventListener(
"click",
()=>{

  if(!source){

    spriteStatus.className=
    "status err";

    spriteStatus.innerHTML=
    "Pilih PNG terlebih dahulu.";

    return;

  }


  if(rigPlacing){

    spriteStatus.className=
    "status warn";

    spriteStatus.innerHTML=
    "⚠ Kunci rig dulu sebelum generate.";

    return;

  }


  playing=false;

  reviewPlaying=false;

  reviewIndex=0;

  reviewTimer=0;

  generatedFrames=[];

  reviewToggleBtn.textContent=
  "▶ REVIEW GERAKAN";

  preview.innerHTML="";


  const frameSize=350;

  const frameCount=8;


  spriteSheet=
  document.createElement(
    "canvas"
  );


  spriteSheet.width=
  frameSize*
  frameCount;


  spriteSheet.height=
  frameSize;


  const sctx=
  spriteSheet.getContext(
    "2d"
  );


  sctx.clearRect(
    0,
    0,
    spriteSheet.width,
    spriteSheet.height
  );


  for(
    let i=0;
    i<frameCount;
    i++
  ){

    const frame=
    makeFrame(
      i/frameCount,
      frameSize
    );


    generatedFrames.push(
      frame
    );


    sctx.drawImage(
      frame,
      i*frameSize,
      0
    );


    /*
      Preview.
    */

    const box=
    document.createElement(
      "div"
    );


    box.className=
    "previewBox";


    const small=
    document.createElement(
    "canvas"
    );


    small.width=180;

    small.height=180;


    small
    .getContext("2d")
    .drawImage(
      frame,
      0,
      0,
      180,
      180
    );


    box.appendChild(
      small
    );


    preview.appendChild(
      box
    );

  }


  spriteStatus.className=
  "status ok";

  spriteStatus.innerHTML=
  "✓ 8 frame walk cycle dibuat.<br>"+
  "Sprite sheet: "+
  spriteSheet.width+
  " × "+
  spriteSheet.height+" px.";


  drawReviewFrame();

});


/* =====================================================
DOWNLOAD
===================================================== */

document
.getElementById("download")
.addEventListener(
"click",
()=>{

  if(!spriteSheet){

    spriteStatus.className=
    "status err";

    spriteStatus.innerHTML=
    "Generate 8 frame dahulu.";

    return;

  }


  spriteSheet.toBlob(
  function(blob){

    const url=
    URL.createObjectURL(
      blob
    );


    const a=
    document.createElement(
      "a"
    );


    a.href=url;

    a.download=
    "character_walk_V15.png";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(url);
      },
      1000
    );

  },
  "image/png"
  );

});
