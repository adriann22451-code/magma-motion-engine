<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI Motion Engine V16 — Cutout Rig</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:#080b11;color:#fff;font-family:Arial,sans-serif;}
.app{width:100%;max-width:720px;margin:auto;padding:14px;}
h1{margin:0;font-size:22px;}
.sub{color:#8994a7;font-size:13px;margin:5px 0 14px;}
.panel{background:#141a24;border:1px solid #293548;border-radius:15px;padding:13px;margin-bottom:12px;}
.canvasBox{width:100%;aspect-ratio:1;overflow:hidden;border-radius:12px;
  background:
    linear-gradient(45deg,#171e29 25%,transparent 25%),
    linear-gradient(-45deg,#171e29 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#171e29 75%),
    linear-gradient(-45deg,transparent 75%,#171e29 75%);
  background-size:24px 24px;
  background-position:0 0,0 12px,12px -12px,-12px 0;
}
canvas{width:100%;height:100%;display:block;touch-action:none;}
button,label{display:inline-block;border:0;border-radius:10px;padding:11px 13px;margin:3px;color:#fff;background:#2a364a;font-size:14px;font-weight:bold;cursor:pointer;}
button:active,label:active{transform:scale(.97);}
button:disabled{opacity:.4;}
.blue{background:#386cff;}
.green{background:#15935b;}
.red{background:#bb4054;}
.orange{background:#a96b20;}
.purple{background:#7048b8;}
input[type=file]{display:none;}
.status{background:#0b1017;border-radius:9px;padding:10px;margin-top:8px;font-size:12px;line-height:1.5;color:#a5b0c0;}
.ok{color:#70ffab;}
.warn{color:#ffd36b;}
.err{color:#ff7287;}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.row span{width:65px;font-size:12px;color:#9da9bb;}
.row input{flex:1;}
.row b{width:40px;font-size:12px;}
.info{color:#7f8b9f;font-size:11px;line-height:1.5;}
.stepList{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
.stepChip{font-size:11px;padding:5px 9px;border-radius:20px;background:#1c2634;color:#6c7a90;}
.stepChip.done{background:#15935b;color:#fff;}
.stepChip.active{background:#386cff;color:#fff;}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;}
.previewBox{aspect-ratio:1;overflow:hidden;border-radius:7px;border:1px solid #293548;
  background:
    linear-gradient(45deg,#171e29 25%,transparent 25%),
    linear-gradient(-45deg,#171e29 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#171e29 75%),
    linear-gradient(-45deg,transparent 75%,#171e29 75%);
  background-size:12px 12px;
  background-position:0 0,0 6px,6px -6px,-6px 0;
}
.reviewBox{width:160px;aspect-ratio:1;margin:10px auto 0;overflow:hidden;border-radius:10px;border:1px solid #293548;
  background:
    linear-gradient(45deg,#171e29 25%,transparent 25%),
    linear-gradient(-45deg,#171e29 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#171e29 75%),
    linear-gradient(-45deg,transparent 75%,#171e29 75%);
  background-size:16px 16px;
  background-position:0 0,0 8px,8px -8px,-8px 0;
}
#reviewCanvas{width:100%;height:100%;display:block;}
</style>
</head>
<body>
<div class="app">

<h1>AI Motion Engine V16</h1>
<div class="sub">Cutout Rig — Rigid Limb Rotation (bukan mesh warp)</div>

<!-- UPLOAD -->
<div class="panel">
<label class="blue">📁 PILIH PNG
<input id="file" type="file" accept="image/png,image/webp">
</label>
<button id="original">👁 ORIGINAL</button>
<button id="reset">↺ RESET</button>
<div id="status" class="status">Pilih PNG karakter.</div>
</div>

<!-- CANVAS -->
<div class="panel">
<div class="canvasBox"><canvas id="canvas" width="700" height="700"></canvas></div>
</div>

<!-- CUTOUT SETUP -->
<div class="panel" id="cutPanel" style="display:none;">
<div class="stepList" id="stepList"></div>
<div class="info" id="cutHint">—</div>
<button id="undoCut" class="orange">◀ ULANGI BAGIAN INI</button>
<button id="skipPart" class="orange" style="display:none;">⏭ LEWATI (TIDAK ADA)</button>
<button id="resetCut" class="red">↺ RESET SEMUA POTONGAN</button>
<div id="cutStatus" class="status">Mulai dengan menarik kotak di gambar. Tap chip nama bagian yang sudah selesai untuk gambar ulang kotaknya.</div>
</div>

<!-- CONTROLS -->
<div class="panel">
<button id="rig" class="orange">🦴 SHOW RIG</button>
<button id="walk" class="green">▶ WALK</button>
<button id="stop" class="red">■ STOP</button>
<button id="editCuts" class="purple">✏ EDIT POTONGAN</button>
<br>
<button id="generate" class="blue">🎞 GENERATE 8 FRAME</button>
<div class="row"><span>Speed</span><input id="speed" type="range" min="0.3" max="2" step="0.1" value="0.8"><b id="speedText">0.8</b></div>
<div class="row"><span>Step</span><input id="step" type="range" min="0" max="1" step="0.05" value="0.65"><b id="stepText">0.65</b></div>
<div class="row"><span>Arm</span><input id="arm" type="range" min="0" max="1" step="0.05" value="0.55"><b id="armText">0.55</b></div>
<div id="rigStatus" class="status">Rig belum siap.</div>
</div>

<!-- SPRITE -->
<div class="panel">
<div class="info">Sprite sheet transparan 8 frame.</div>
<div id="preview" class="preview"></div>
<div class="reviewBox"><canvas id="reviewCanvas" width="350" height="350"></canvas></div>
<button id="reviewToggle" class="purple" style="display:block;margin:8px auto 0;">▶ REVIEW GERAKAN</button>
<div id="spriteStatus" class="status">Belum ada sprite.</div>
<button id="download" class="green">⬇ DOWNLOAD SPRITE</button>
</div>

</div>

<script>
/* ================= ELEMENTS ================= */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality="high";
const fileInput=document.getElementById("file");
const statusBox=document.getElementById("status");
const rigStatus=document.getElementById("rigStatus");
const spriteStatus=document.getElementById("spriteStatus");
const preview=document.getElementById("preview");
const speedInput=document.getElementById("speed");
const stepInput=document.getElementById("step");
const armInput=document.getElementById("arm");
const speedText=document.getElementById("speedText");
const stepText=document.getElementById("stepText");
const armText=document.getElementById("armText");
const cutPanel=document.getElementById("cutPanel");
const cutHint=document.getElementById("cutHint");
const cutStatus=document.getElementById("cutStatus");
const stepList=document.getElementById("stepList");
const undoCutBtn=document.getElementById("undoCut");
const skipPartBtn=document.getElementById("skipPart");
const resetCutBtn=document.getElementById("resetCut");
const reviewCanvas=document.getElementById("reviewCanvas");
const reviewCtx=reviewCanvas.getContext("2d");
const reviewToggleBtn=document.getElementById("reviewToggle");

/* ================= STATE ================= */
let source=null;
let bounds=null;
let playing=false;
let showRig=false;
let phase=0;
let lastTime=performance.now();
let spriteSheet=null;

const PARTS=[
  {key:"torso",label:"Torso+Kepala",hint:"Tarik kotak mengelilingi SELURUH badan: kepala, dada, perut, sampai pinggul. Boleh lebih besar dari badan asli, boleh menutupi lengan/kaki juga — itu aman."},
  {key:"armL",label:"Lengan A",hint:"Mulai dari BAHU (atas kotak), tarik ke bawah sampai UJUNG TANGAN."},
  {key:"armR",label:"Lengan B",hint:"Mulai dari BAHU (atas kotak), tarik ke bawah sampai UJUNG TANGAN."},
  {key:"legL",label:"Kaki A",hint:"Mulai dari PINGGUL (atas kotak), tarik ke bawah sampai UJUNG KAKI."},
  {key:"legR",label:"Kaki B",hint:"Mulai dari PINGGUL (atas kotak), tarik ke bawah sampai UJUNG KAKI."},
  {key:"tail",label:"Ekor",hint:"Mulai dari PANGKAL EKOR (dekat badan), tarik sampai UJUNG EKOR. Kalau tidak ada ekor, tekan LEWATI.",optional:true}
];

let editKey=null; // key bagian yang sedang digambar ulang di luar urutan normal
let cutStep=-1; // -1 = not cutting / done
let cutBoxes={};
let cutouts={};
let rigLocked=false;
let drag=null; // {x0,y0,x1,y1}

let generatedFrames=[];
let reviewPlaying=false;
let reviewIndex=0;
let reviewTimer=0;

/* ================= UPLOAD ================= */
fileInput.addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      createSource(img);
      resetCutoutState();
      cutStep=0;
      cutPanel.style.display="block";
      rigLocked=false;
      updateCutUI();
      statusBox.className="status ok";
      statusBox.innerHTML="✓ Karakter dimuat.<br>Potong tubuh jadi 5 bagian di bawah.";
      draw();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
});

function createSource(img){
  let w=img.naturalWidth, h=img.naturalHeight;
  const max=900;
  const scale=Math.min(1,max/Math.max(w,h));
  w=Math.round(w*scale); h=Math.round(h*scale);
  source=document.createElement("canvas");
  source.width=w; source.height=h;
  const sctx=source.getContext("2d");
  sctx.imageSmoothingEnabled=true;
  sctx.imageSmoothingQuality="high";
  sctx.clearRect(0,0,w,h);
  sctx.drawImage(img,0,0,w,h);
  bounds=getBounds();
}

function getBounds(){
  const sctx=source.getContext("2d");
  const data=sctx.getImageData(0,0,source.width,source.height).data;
  let minX=source.width,minY=source.height,maxX=-1,maxY=-1;
  for(let y=0;y<source.height;y++){
    for(let x=0;x<source.width;x++){
      const i=(y*source.width+x)*4;
      if(data[i+3]>10){
        minX=Math.min(minX,x); minY=Math.min(minY,y);
        maxX=Math.max(maxX,x); maxY=Math.max(maxY,y);
      }
    }
  }
  if(maxX<0)return{x:0,y:0,w:source.width,h:source.height};
  return{x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
}

/* ================= VIEW TRANSFORM ================= */
function computeView(size){
  const margin=size*0.11;
  const avail=size-margin*2;
  const scale=Math.min(avail/bounds.w,avail/bounds.h);
  const ox=(size-bounds.w*scale)/2-bounds.x*scale;
  const oy=(size-bounds.h*scale)/2-bounds.y*scale;
  return{scale,ox,oy};
}
function toScreen(view,x,y){return{x:view.ox+x*view.scale,y:view.oy+y*view.scale};}
function getCanvasPos(e){
  const rect=canvas.getBoundingClientRect();
  return{
    x:(e.clientX-rect.left)*(canvas.width/rect.width),
    y:(e.clientY-rect.top)*(canvas.height/rect.height)
  };
}
function canvasToSource(pt){
  const view=computeView(700);
  return{x:(pt.x-view.ox)/view.scale,y:(pt.y-view.oy)/view.scale};
}

/* ================= CUTOUT STATE HELPERS ================= */
function resetCutoutState(){
  cutStep=-1;
  editKey=null;
  cutBoxes={};
  cutouts={};
  rigLocked=false;
  drag=null;
  generatedFrames=[];
  reviewPlaying=false;
  reviewIndex=0;
  reviewTimer=0;
  reviewToggleBtn.textContent="▶ REVIEW GERAKAN";
  reviewCtx.clearRect(0,0,reviewCanvas.width,reviewCanvas.height);
  spriteSheet=null;
  preview.innerHTML="";
  spriteStatus.className="status";
  spriteStatus.innerHTML="Belum ada sprite.";
}

function updateCutUI(){
  stepList.innerHTML="";
  PARTS.forEach(function(p,i){
    const isDone=cutBoxes[p.key]!==undefined;
    const clickable=isDone||i<cutStep||cutStep>=PARTS.length;
    const chip=document.createElement("div");
    chip.className="stepChip"+(isDone?" done":"")+((i===cutStep&&!editKey)||editKey===p.key?" active":"");
    chip.textContent=p.label+(isDone?" ✓":(p.optional?" (opsional)":""));
    if(clickable){
      chip.style.cursor="pointer";
      chip.title="Tap untuk gambar ulang bagian ini";
      chip.addEventListener("click",function(){
        if(!source)return;
        editKey=p.key;
        rigLocked=false;
        cutPanel.style.display="block";
        updateCutUI();
        draw();
      });
    }
    stepList.appendChild(chip);
  });
  if(editKey){
    const part=PARTS.filter(function(pp){return pp.key===editKey;})[0];
    cutHint.textContent=part?part.hint:"—";
    cutStatus.className="status warn";
    cutStatus.innerHTML="✏ Gambar ulang: <b>"+(part?part.label:"")+"</b>";
    undoCutBtn.disabled=true;
    skipPartBtn.style.display="none";
    return;
  }
  if(cutStep>=0&&cutStep<PARTS.length){
    cutHint.textContent=PARTS[cutStep].hint;
    cutStatus.className="status warn";
    cutStatus.innerHTML="⚠ Potong bagian: <b>"+PARTS[cutStep].label+"</b>";
    undoCutBtn.disabled=cutStep===0;
    skipPartBtn.style.display=PARTS[cutStep].optional?"inline-block":"none";
  }else if(cutStep>=PARTS.length){
    cutHint.textContent="Semua bagian sudah dipotong. Tap chip mana pun untuk memperbaiki posisinya.";
    cutStatus.className="status ok";
    cutStatus.innerHTML="✓ Rig siap dibuat.";
    skipPartBtn.style.display="none";
  }
}

/* ================= POINTER: CUTTING ================= */
canvas.addEventListener("pointerdown",function(e){
  if(!source||rigLocked)return;
  if(!editKey&&(cutStep<0||cutStep>=PARTS.length))return;
  const p=canvasToSource(getCanvasPos(e));
  drag={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",function(e){
  if(!drag)return;
  const p=canvasToSource(getCanvasPos(e));
  drag.x1=p.x; drag.y1=p.y;
  draw();
});
function finishDrag(){
  if(!drag)return;
  const x=Math.min(drag.x0,drag.x1);
  const y=Math.min(drag.y0,drag.y1);
  const w=Math.abs(drag.x1-drag.x0);
  const h=Math.abs(drag.y1-drag.y0);
  drag=null;
  if(w<6||h<6){draw();return;}
  if(editKey){
    cutBoxes[editKey]={x,y,w,h};
    const done=cutStep>=PARTS.length;
    editKey=null;
    updateCutUI();
    if(done){buildCutouts();}
    draw();
    return;
  }
  const key=PARTS[cutStep].key;
  cutBoxes[key]={x,y,w,h};
  cutStep++;
  updateCutUI();
  if(cutStep>=PARTS.length){
    buildCutouts();
  }
  draw();
}
canvas.addEventListener("pointerup",finishDrag);
canvas.addEventListener("pointercancel",function(){drag=null;draw();});

skipPartBtn.addEventListener("click",function(){
  if(editKey)return;
  if(cutStep<0||cutStep>=PARTS.length)return;
  if(!PARTS[cutStep].optional)return;
  cutStep++;
  updateCutUI();
  if(cutStep>=PARTS.length){
    buildCutouts();
  }
  draw();
});

undoCutBtn.addEventListener("click",function(){
  if(editKey)return;
  if(cutStep<=0)return;
  cutStep--;
  delete cutBoxes[PARTS[cutStep].key];
  rigLocked=false;
  updateCutUI();
  draw();
});
resetCutBtn.addEventListener("click",function(){
  cutBoxes={};
  cutouts={};
  rigLocked=false;
  cutStep=0;
  editKey=null;
  updateCutUI();
  draw();
});

/* ================= BUILD CUTOUTS ================= */
function featherEdges(canvas,feather){
  const w=canvas.width,h=canvas.height;
  if(feather<=0||w<=feather*2||h<=feather*2)return;
  const mask=document.createElement("canvas");
  mask.width=w; mask.height=h;
  const mctx=mask.getContext("2d");
  mctx.fillStyle="#fff";
  mctx.fillRect(0,0,w,h);
  const blurred=document.createElement("canvas");
  blurred.width=w; blurred.height=h;
  const bctx=blurred.getContext("2d");
  bctx.filter="blur("+feather+"px)";
  bctx.drawImage(mask,0,0);
  const cctx=canvas.getContext("2d");
  cctx.save();
  cctx.globalCompositeOperation="destination-in";
  cctx.drawImage(blurred,0,0);
  cctx.restore();
}

function clearRectFeathered(canvas,x,y,w,h,feather,amount){
  amount=(amount===undefined)?1:amount;
  const cctx=canvas.getContext("2d");
  if(feather<=0){
    cctx.save();
    cctx.globalAlpha=amount;
    cctx.globalCompositeOperation="destination-out";
    cctx.fillStyle="#000";
    cctx.fillRect(x,y,w,h);
    cctx.restore();
    return;
  }
  const mask=document.createElement("canvas");
  mask.width=canvas.width; mask.height=canvas.height;
  const mctx=mask.getContext("2d");
  mctx.filter="blur("+feather+"px)";
  mctx.fillStyle="#fff";
  mctx.fillRect(x,y,w,h);
  cctx.save();
  cctx.globalAlpha=amount;
  cctx.globalCompositeOperation="destination-out";
  cctx.drawImage(mask,0,0);
  cctx.restore();
}

function buildCutouts(){
  PARTS.forEach(function(p){
    const box=cutBoxes[p.key];
    if(!box)return;
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(box.w));
    c.height=Math.max(1,Math.round(box.h));
    const cctx=c.getContext("2d");
    cctx.imageSmoothingEnabled=true;
    cctx.imageSmoothingQuality="high";
    cctx.drawImage(source,box.x,box.y,box.w,box.h,0,0,c.width,c.height);
    const feather=Math.min(10,Math.max(2,Math.round(Math.min(c.width,c.height)*0.035)));
    featherEdges(c,feather);
    cutouts[p.key]={
      canvas:c,
      w:box.w,
      h:box.h,
      anchorX:box.x+box.w/2,
      anchorY:box.y
    };
  });

  // Catatan: sebelumnya di sini area lengan/kaki dihapus dari torso untuk
  // menghindari duplikat statis ("ghost limb"). Ternyata untuk karakter
  // humanoid, kotak lengan (bahu→tangan) dan kaki (pinggul→kaki) hampir
  // selalu menutupi hampir seluruh badan di bawah kepala, jadi penghapusan
  // itu membuat sebagian besar torso hilang. Torso dikembalikan utuh;
  // hanya tepi luarnya yang dilunakkan sedikit.
  const torsoCut=cutouts.torso;
  if(torsoCut){
    const torsoFeather=Math.min(10,Math.max(2,Math.round(Math.min(torsoCut.canvas.width,torsoCut.canvas.height)*0.02)));
    featherEdges(torsoCut.canvas,torsoFeather);
  }

  rigLocked=true;
  cutPanel.style.display="none";
  rigStatus.className="status ok";
  rigStatus.innerHTML="✓ Rig siap.<br>Lengan & kaki berputar kaku di sendi, tidak lagi meregang.";
}

/* ================= POSE (pure function of phase) ================= */
function computePose(ph,amount,armAmount){
  const s=Math.sin(ph*Math.PI*2);
  const maxLeg=0.55;
  const maxArm=0.45;
  const maxTail=0.3;
  return{
    torsoBob:-Math.abs(s)*bounds.h*.012,
    legL:s*maxLeg*amount,
    legR:-s*maxLeg*amount,
    armL:-s*maxArm*armAmount,
    armR:s*maxArm*armAmount,
    tail:-s*maxTail*amount,
    front:s>=0?"L":"R"
  };
}

/* ================= RENDER PART ================= */
function drawPart(target,view,key,angle,bobY){
  const cut=cutouts[key];
  if(!cut)return;
  const pivot=toScreen(view,cut.anchorX,cut.anchorY+(bobY||0));
  target.save();
  target.translate(pivot.x,pivot.y);
  target.rotate(angle||0);
  target.drawImage(
    cut.canvas,
    -(cut.w/2)*view.scale,
    0,
    cut.w*view.scale,
    cut.h*view.scale
  );
  target.restore();
}

function drawTorso(target,view,bobY){
  const cut=cutouts.torso;
  if(!cut)return;
  const topLeft=toScreen(view,cut.anchorX-cut.w/2,cut.anchorY+(bobY||0));
  target.drawImage(cut.canvas,topLeft.x,topLeft.y,cut.w*view.scale,cut.h*view.scale);
}

function renderScene(target,size,pose){
  target.setTransform(1,0,0,1,0,0);
  target.clearRect(0,0,size,size);
  if(!source)return;
  const view=computeView(size);
  if(!rigLocked)return;

  const backLeg=pose.front==="L"?"legR":"legL";
  const backArm=pose.front==="L"?"armR":"armL";
  const frontArm=pose.front==="L"?"armL":"armR";
  const frontLeg=pose.front==="L"?"legL":"legR";

  drawPart(target,view,"tail",pose.tail,pose.torsoBob);
  drawPart(target,view,backLeg,pose[backLeg],pose.torsoBob);
  drawPart(target,view,backArm,pose[backArm],pose.torsoBob);
  drawTorso(target,view,pose.torsoBob);
  drawPart(target,view,frontArm,pose[frontArm],pose.torsoBob);
  drawPart(target,view,frontLeg,pose[frontLeg],pose.torsoBob);

  if(showRig&&size===700){
    drawPivots(target,view,pose);
  }
}

function drawPivots(target,view,pose){
  const keys=["armL","armR","legL","legR","tail"];
  target.save();
  keys.forEach(function(k){
    const cut=cutouts[k];
    if(!cut)return;
    const p=toScreen(view,cut.anchorX,cut.anchorY+pose.torsoBob);
    target.beginPath();
    target.arc(p.x,p.y,7,0,Math.PI*2);
    target.fillStyle="#ff4d6d";
    target.fill();
    target.beginPath();
    target.moveTo(p.x,p.y);
    target.lineTo(p.x+Math.sin(pose[k])*28,p.y+Math.cos(pose[k])*28);
    target.strokeStyle="#4da6ff";
    target.lineWidth=3;
    target.stroke();
  });
  target.restore();
}

/* ================= MAIN DRAW ================= */
function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,700,700);

  if(!source){
    ctx.fillStyle="#8792a5";
    ctx.textAlign="center";
    ctx.font="18px Arial";
    ctx.fillText("Pilih PNG karakter",350,350);
    return;
  }

  const view=computeView(700);

  if(!rigLocked&&(editKey||(cutStep>=0&&cutStep<PARTS.length))){
    // cutting mode: draw base image + confirmed boxes + active drag
    ctx.drawImage(source,view.ox,view.oy,source.width*view.scale,source.height*view.scale);

    Object.keys(cutBoxes).forEach(function(key){
      const b=cutBoxes[key];
      const tl=toScreen(view,b.x,b.y);
      ctx.strokeStyle="rgba(21,147,91,.9)";
      ctx.lineWidth=2;
      ctx.strokeRect(tl.x,tl.y,b.w*view.scale,b.h*view.scale);
    });

    if(drag){
      const x=Math.min(drag.x0,drag.x1), y=Math.min(drag.y0,drag.y1);
      const w=Math.abs(drag.x1-drag.x0), h=Math.abs(drag.y1-drag.y0);
      const tl=toScreen(view,x,y);
      ctx.strokeStyle="#ffd36b";
      ctx.lineWidth=2;
      ctx.setLineDash([6,4]);
      ctx.strokeRect(tl.x,tl.y,w*view.scale,h*view.scale);
      ctx.setLineDash([]);
    }
    return;
  }

  if(!rigLocked){
    ctx.drawImage(source,view.ox,view.oy,source.width*view.scale,source.height*view.scale);
    return;
  }

  const pose=computePose(phase,Number(stepInput.value),Number(armInput.value));
  renderScene(ctx,700,pose);
}

/* ================= WALK / STOP / RIG TOGGLE ================= */
document.getElementById("walk").addEventListener("click",function(){
  if(!source){statusBox.className="status err";statusBox.innerHTML="Pilih PNG terlebih dahulu.";return;}
  if(!rigLocked){statusBox.className="status warn";statusBox.innerHTML="⚠ Selesaikan potongan rig dulu.";return;}
  playing=true;
  statusBox.className="status ok";
  statusBox.innerHTML="▶ WALK aktif — limb rigid rotation.";
});
document.getElementById("stop").addEventListener("click",function(){
  playing=false; phase=0; draw();
  statusBox.className="status";
  statusBox.innerHTML="■ Animasi berhenti.";
});
document.getElementById("rig").addEventListener("click",function(){
  showRig=!showRig;
  this.textContent=showRig?"🦴 HIDE RIG":"🦴 SHOW RIG";
  draw();
});
document.getElementById("editCuts").addEventListener("click",function(){
  if(!source)return;
  playing=false;
  if(cutStep<0||cutStep>PARTS.length)cutStep=PARTS.length;
  cutPanel.style.display="block";
  updateCutUI();
  draw();
});
document.getElementById("original").addEventListener("click",function(){
  if(!source)return;
  playing=false; phase=0;
  const view=computeView(700);
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,700,700);
  ctx.drawImage(source,view.ox,view.oy,source.width*view.scale,source.height*view.scale);
  statusBox.className="status ok";
  statusBox.innerHTML="✓ ORIGINAL — tanpa deformasi.";
});

/* ================= SLIDERS ================= */
speedInput.addEventListener("input",function(){speedText.textContent=Number(speedInput.value).toFixed(1);});
stepInput.addEventListener("input",function(){stepText.textContent=Number(stepInput.value).toFixed(2);if(!playing)draw();});
armInput.addEventListener("input",function(){armText.textContent=Number(armInput.value).toFixed(2);if(!playing)draw();});

/* ================= ANIMATION LOOP ================= */
function loop(now){
  const dt=(now-lastTime)/1000;
  lastTime=now;

  if(playing){
    phase+=dt*Number(speedInput.value)*.55;
    if(phase>=1)phase-=1;
    draw();
  }

  if(reviewPlaying&&generatedFrames.length>0){
    const frameInterval=.15/Number(speedInput.value);
    reviewTimer+=dt;
    while(reviewTimer>=frameInterval){
      reviewTimer-=frameInterval;
      reviewIndex=(reviewIndex+1)%generatedFrames.length;
    }
    drawReviewFrame();
  }

  requestAnimationFrame(loop);
}

function drawReviewFrame(){
  reviewCtx.clearRect(0,0,reviewCanvas.width,reviewCanvas.height);
  if(generatedFrames.length===0)return;
  reviewCtx.drawImage(generatedFrames[reviewIndex],0,0);
}

reviewToggleBtn.addEventListener("click",function(){
  if(generatedFrames.length===0){
    spriteStatus.className="status err";
    spriteStatus.innerHTML="Generate 8 frame dahulu.";
    return;
  }
  reviewPlaying=!reviewPlaying;
  reviewToggleBtn.textContent=reviewPlaying?"■ STOP REVIEW":"▶ REVIEW GERAKAN";
  reviewTimer=0;
});

requestAnimationFrame(loop);

/* ================= MAKE FRAME ================= */
function makeFrame(framePhase,size){
  const frame=document.createElement("canvas");
  frame.width=size; frame.height=size;
  const fctx=frame.getContext("2d");
  fctx.imageSmoothingEnabled=true;
  fctx.imageSmoothingQuality="high";
  const pose=computePose(framePhase,Number(stepInput.value),Number(armInput.value));
  renderScene(fctx,size,pose);
  return frame;
}

/* ================= GENERATE SPRITE ================= */
document.getElementById("generate").addEventListener("click",function(){
  if(!source){spriteStatus.className="status err";spriteStatus.innerHTML="Pilih PNG terlebih dahulu.";return;}
  if(!rigLocked){spriteStatus.className="status warn";spriteStatus.innerHTML="⚠ Selesaikan potongan rig dulu.";return;}

  playing=false;
  reviewPlaying=false;
  reviewIndex=0;
  reviewTimer=0;
  generatedFrames=[];
  reviewToggleBtn.textContent="▶ REVIEW GERAKAN";
  preview.innerHTML="";

  const frameSize=500, frameCount=8;
  spriteSheet=document.createElement("canvas");
  spriteSheet.width=frameSize*frameCount;
  spriteSheet.height=frameSize;
  const sctx=spriteSheet.getContext("2d");
  sctx.clearRect(0,0,spriteSheet.width,spriteSheet.height);

  for(let i=0;i<frameCount;i++){
    const frame=makeFrame(i/frameCount,frameSize);
    generatedFrames.push(frame);
    sctx.drawImage(frame,i*frameSize,0);

    const box=document.createElement("div");
    box.className="previewBox";
    const small=document.createElement("canvas");
    small.width=180; small.height=180;
    small.getContext("2d").drawImage(frame,0,0,180,180);
    box.appendChild(small);
    preview.appendChild(box);
  }

  spriteStatus.className="status ok";
  spriteStatus.innerHTML="✓ 8 frame walk cycle dibuat.<br>Sprite sheet: "+spriteSheet.width+" × "+spriteSheet.height+" px.";
  drawReviewFrame();
});

/* ================= DOWNLOAD ================= */
document.getElementById("download").addEventListener("click",function(){
  if(!spriteSheet){spriteStatus.className="status err";spriteStatus.innerHTML="Generate 8 frame dahulu.";return;}
  spriteSheet.toBlob(function(blob){
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download="character_walk_V16.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
  },"image/png");
});

/* ================= RESET ================= */
document.getElementById("reset").addEventListener("click",function(){
  source=null; bounds=null;
  playing=false; showRig=false; phase=0;
  cutPanel.style.display="none";
  resetCutoutState();
  ctx.clearRect(0,0,700,700);
  statusBox.className="status";
  statusBox.innerHTML="Pilih PNG karakter.";
  rigStatus.className="status";
  rigStatus.innerHTML="Rig belum siap.";
  document.getElementById("rig").textContent="🦴 SHOW RIG";
  draw();
});

/* ================= INITIAL ================= */
draw();
</script>
</body>
